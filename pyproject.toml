[project]
name = "verirag"
version = "0.1.0"
description = "Phase 1 document ingestion for a citation-aware RAG system"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24,<2",
    "numpy>=1.26,<3",
    "sentence-transformers>=3,<6",
    "rank-bm25>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

